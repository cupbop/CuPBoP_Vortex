# Modified from Vortex CI by Aaron Kantsevoy (akantsevoy3@gatech.edu)
#
# Target: Vortex 3.0 (release tag v3.0) with toolchain v3.0.1 (Vortex LLVM 20), both installed under
# /projects/ci-runners/CuPBoP-Vortex/tools (vortex_v3.0, tools-v3.0.1); environment: ci/rg-ci-setup-v3.sh.
#   build : ci/run-crnch-cuda.sh      — CuPBoP translators + host runtime, and the two SimX drivers
#                                        (main config, TCU+DXA config for the tensor examples)
#   tests : ci/run-crnch-cuda-test.sh — `make ci` of one matrix entry inside the CI container
#   verify: ci/check_correctness.sh   — per-example rule (program verdict / golden compare / exact diff)
# The same 77-entry matrix can be run as one Slurm job with ci/run-v3-matrix.sbatch.

name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: self-hosted
    # Self-hosted runner on a public repo: never run code from a fork's pull request here.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout Repositoty
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: false

      - name: Run Sbatch file
        run: |
          chmod +x ./ci/run-crnch-cuda.sh
          # Slurm log dir: the shared report dir when this account can write it, else inside the workspace
          CI_LOG_DIR=/tools/ci-reports/CuPBoP_logs; [ -w "$CI_LOG_DIR" ] || { CI_LOG_DIR=$GITHUB_WORKSPACE/ci/logs_runner; mkdir -p "$CI_LOG_DIR"; }
          sbatch --wait --export=ALL,CI_LOG_DIR=$CI_LOG_DIR -o $CI_LOG_DIR/CuPBoP-cuda-test-%j.out ./ci/run-crnch-cuda.sh

  tests:
    runs-on: self-hosted
    needs: build
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        name: [backprop, dotproduct, pathfinder, psum, bfs, btree, conv3, nn, saxpy, sgemm, stencil, transpose, vecadd, bh-cuda, blackscholes, cc-cuda, cfd, gauss, hotspot, huffman, jaccard-cuda, jacobi-cuda, lud, marchingCubes-cuda, nw, psort, score-cuda, sfilter, spmv, srad_v2, streamcluster, wedford-cuda, sgemm_tcu, sgemm_dxa, sgemm_tcu_dxa, sgemm_wgmma]
        scheduler: [2, 0]
        localmem: [1]
        exclude:
          # TCU/DXA benchmarks only run on SCHE_2 (require parallel threads)
          - name: sgemm_tcu
            scheduler: 0
          - name: sgemm_dxa
            scheduler: 0
          - name: sgemm_tcu_dxa
            scheduler: 0
          - name: sgemm_wgmma
            scheduler: 0
        include:
          # SCHE_2 + LOCALMEM=0 for shared memory benchmarks
          - name: bh-cuda
            scheduler: 2
            localmem: 0
          - name: cc-cuda
            scheduler: 2
            localmem: 0
          - name: hotspot
            scheduler: 2
            localmem: 0
          - name: jaccard-cuda
            scheduler: 2
            localmem: 0
          - name: jacobi-cuda
            scheduler: 2
            localmem: 0
          - name: marchingCubes-cuda
            scheduler: 2
            localmem: 0
          - name: score-cuda
            scheduler: 2
            localmem: 0
          - name: wedford-cuda
            scheduler: 2
            localmem: 0
          - name: sgemm_dxa
            scheduler: 2
            localmem: 0
          - name: sgemm_tcu_dxa
            scheduler: 2
            localmem: 0
        # Previous temporary config (new benchmarks only):
        # name: [bh-cuda, blackscholes, cc-cuda, cfd, gauss, hotspot, huffman, jaccard-cuda, jacobi-cuda, lud, marchingCubes-cuda, nw, psort, score-cuda, sfilter, spmv, srad_v2, streamcluster, wedford-cuda]
        # scheduler: [2]
        # localmem: [1]

    steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

      - name: Run tests (SBATCH)
        run: |
          export TEST_NAME="${{ matrix.name }}"
          export VORTEX_SCHEDULE_FLAG="${{ matrix.scheduler }}"
          export VORTEX_LOCALMEM_FLAG="${{ matrix.localmem }}"
          chmod +x ./ci/run-crnch-cuda-test.sh
          CI_LOG_DIR=/tools/ci-reports/CuPBoP_logs; [ -w "$CI_LOG_DIR" ] || { CI_LOG_DIR=$GITHUB_WORKSPACE/ci/logs_runner; mkdir -p "$CI_LOG_DIR"; }
          sbatch --wait --export=ALL,CI_LOG_DIR=$CI_LOG_DIR -o $CI_LOG_DIR/CuPBoP-cuda-test-%j.out ./ci/run-crnch-cuda-test.sh
          echo "Showing last 100 lines of log:"
          LOG_FILE=/tools/ci-reports/CuPBoP_logs/${TEST_NAME}.out
          tail -n 100 $LOG_FILE

          if grep -q "Kernel compilation completed!" "$LOG_FILE" && \
             grep -q "Host compilation completed!" "$LOG_FILE" && \
             grep -q "Execution completed!" "$LOG_FILE"; then
            echo "Execution successful!"
          else
            echo "Execution failure."
            exit 1
          fi

      - name: Verify Correctness
        if: always()
        run: |
          # Rules live in ci/check_correctness.sh (shared with ci/run-v3-matrix.sbatch). It prints the verdict,
          # writes examples/<test>/ci_status_SCHE_<s>_LMEM_<l>.txt and exits 1 on FAIL.
          echo "PWD: $(pwd)"
          chmod +x ./ci/check_correctness.sh
          ./ci/check_correctness.sh "${{ matrix.name }}" "${{ matrix.scheduler }}" "${{ matrix.localmem }}"

      - name: Report Performance
        if: always()
        run: |
          export TEST_NAME="${{ matrix.name }}"
          export SCHEDULE="${{ matrix.scheduler }}"
          export LMEM="${{ matrix.localmem }}"
          if [ "$LMEM" = "0" ]; then
            PERF_FILE=$(ls ./examples/${TEST_NAME}/Perf_counter_*SCHE_${SCHEDULE}_LOCAL_MEM_0*.txt 2>/dev/null | head -1)
            LABEL="${TEST_NAME} (SCHE_${SCHEDULE}, LMEM=0)"
          else
            PERF_FILE=$(ls ./examples/${TEST_NAME}/Perf_counter_*SCHE_${SCHEDULE}*.txt 2>/dev/null | head -1)
            LABEL="${TEST_NAME} (SCHE_${SCHEDULE})"
          fi
          if [ -n "$PERF_FILE" ]; then
            python3 ./ci/perf_summary.py "$PERF_FILE" "$LABEL" "$SCHEDULE" >> $GITHUB_STEP_SUMMARY
          fi

  complete:
    runs-on: self-hosted
    needs: tests
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Check Completion
        run: echo "All matrix jobs passed"

      - name: Performance Summary
        run: |
          python3 ./ci/perf_summary_all.py ./examples >> $GITHUB_STEP_SUMMARY

