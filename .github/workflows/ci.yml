# Modified from Vortex CI by Aaron Kantsevoy (akantsevoy3@gatech.edu)
#
# Target: Vortex 3.0 (release tag v3.0) with toolchain v3.0.1 (Vortex LLVM 20), both installed under
# /projects/ci-runners/CuPBoP-Vortex/tools (vortex_v3.0, tools-v3.0.1); environment: ci/rg-ci-setup-v3.sh.
#   build : ci/run-crnch-cuda.sh      — CuPBoP translators + host runtime, and the two SimX drivers
#                                        (main config, TCU+DXA config for the tensor examples)
#   tests : ci/run-crnch-cuda-test.sh — `make ci` of one matrix entry inside the CI container
#   verify: ci/check_correctness.sh   — per-example rule (program verdict / golden compare / exact diff)
# The matrix can also be run as one Slurm job with ci/run-v3-matrix.sbatch.

name: CI

on: [push, pull_request]

env:
  CI_RUN_SUBDIR: .cupbop-ci/${{ github.run_id }}

jobs:
  build:
    runs-on: self-hosted
    # Self-hosted runner on a public repo: never run code from a fork's pull request here.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout run revision
        uses: actions/checkout@v4
        with:
          path: ${{ env.CI_RUN_SUBDIR }}
          submodules: recursive

      - name: Run Sbatch file
        run: |
          cd "$GITHUB_WORKSPACE/$CI_RUN_SUBDIR"
          # Slurm log dir: the shared report dir when this account can write it, else inside the workspace
          CI_LOG_DIR=/projects/ci-runners/CuPBoP-Vortex/logs; [ -w "$CI_LOG_DIR" ] || { CI_LOG_DIR=$GITHUB_WORKSPACE/ci/logs_runner; mkdir -p "$CI_LOG_DIR"; }
          sbatch --wait --export=ALL,CI_LOG_DIR=$CI_LOG_DIR -o $CI_LOG_DIR/CuPBoP-cuda-test-%j.out ./ci/run-crnch-cuda.sh

  tests:
    runs-on: self-hosted
    needs: build
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        name: [backprop, dotproduct, pathfinder, psum, bfs, btree, conv3, nn, saxpy, sgemm, stencil, transpose, vecadd, bh-cuda, blackscholes, cc-cuda, cfd, gauss, hotspot, huffman, jaccard-cuda, jacobi-cuda, lud, marchingCubes-cuda, nw, psort, score-cuda, sfilter, spmv, srad_v2, streamcluster, wedford-cuda, sgemm_tcu, sgemm_dxa, sgemm_tcu_dxa, sgemm_wgmma, sgemm_wgmma_dxa, sgemm_wgmma_bf16, cta_loop_test]
        scheduler: [2, 0]
        localmem: [1]
        exclude:
          # TCU/DXA benchmarks only run on SCHE_2 (require parallel threads)
          - name: sgemm_tcu
            scheduler: 0
          - name: sgemm_dxa
            scheduler: 0
          - name: sgemm_tcu_dxa
            scheduler: 0
          - name: sgemm_wgmma
            scheduler: 0
          - name: sgemm_wgmma_dxa
            scheduler: 0
          - name: sgemm_wgmma_bf16
            scheduler: 0
          # the block loop of CUPBOP_CTA_LOOP does not exist at SCHE_0
          - name: cta_loop_test
            scheduler: 0
        include:
          - name: flat_scan_test
            scheduler: 0
            localmem: 1
          - name: flat_shuffle_test
            scheduler: 0
            localmem: 1
          # SCHE_2 + LOCALMEM=0 for shared memory benchmarks
          - name: bh-cuda
            scheduler: 2
            localmem: 0
          - name: cc-cuda
            scheduler: 2
            localmem: 0
          - name: hotspot
            scheduler: 2
            localmem: 0
          - name: jaccard-cuda
            scheduler: 2
            localmem: 0
          - name: jacobi-cuda
            scheduler: 2
            localmem: 0
          - name: marchingCubes-cuda
            scheduler: 2
            localmem: 0
          - name: score-cuda
            scheduler: 2
            localmem: 0
          - name: wedford-cuda
            scheduler: 2
            localmem: 0
          - name: sgemm_dxa
            scheduler: 2
            localmem: 0
          - name: sgemm_tcu_dxa
            scheduler: 2
            localmem: 0
        # Previous temporary config (new benchmarks only):
        # name: [bh-cuda, blackscholes, cc-cuda, cfd, gauss, hotspot, huffman, jaccard-cuda, jacobi-cuda, lud, marchingCubes-cuda, nw, psort, score-cuda, sfilter, spmv, srad_v2, streamcluster, wedford-cuda]
        # scheduler: [2]
        # localmem: [1]

    steps:
      # A retry or another runner may need to populate its own checkout and build.
      - name: Locate run build
        id: locate
        run: |
          if test -f "$CI_RUN_SUBDIR/.ci-built"; then echo "ready=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.locate.outputs.ready != 'yes'
        with:
          path: ${{ env.CI_RUN_SUBDIR }}
          submodules: recursive
      - name: Run tests (SBATCH)
        run: |
          cd "$GITHUB_WORKSPACE/$CI_RUN_SUBDIR"
          export TEST_NAME="${{ matrix.name }}"
          export VORTEX_SCHEDULE_FLAG="${{ matrix.scheduler }}"
          export VORTEX_LOCALMEM_FLAG="${{ matrix.localmem }}"
          CI_LOG_DIR=/projects/ci-runners/CuPBoP-Vortex/logs; [ -w "$CI_LOG_DIR" ] || { CI_LOG_DIR=$GITHUB_WORKSPACE/ci/logs_runner; mkdir -p "$CI_LOG_DIR"; }
          if [ ! -f .ci-built ]; then
            sbatch --wait -o "$CI_LOG_DIR/CuPBoP-build-%j.out" ./ci/run-crnch-cuda.sh
          fi
          status=0
          job_id=$(sbatch --parsable --wait -o "$CI_LOG_DIR/CuPBoP-cuda-test-%j.out" ./ci/run-crnch-cuda-test.sh) || status=$?
          echo "Showing last 100 lines of log:"
          LOG_FILE="$CI_LOG_DIR/CuPBoP-cuda-test-${job_id%%;*}.out"
          tail -n 100 "$LOG_FILE"
          if [ "$status" -ne 0 ]; then exit "$status"; fi

          if grep -q "Kernel compilation completed!" "$LOG_FILE" && \
             grep -q "Host compilation completed!" "$LOG_FILE" && \
             grep -q "Execution completed!" "$LOG_FILE"; then
            echo "Execution successful!"
          else
            echo "Execution failure."
            exit 1
          fi

      - name: Verify Correctness
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/$CI_RUN_SUBDIR"
          # Rules live in ci/check_correctness.sh (shared with ci/run-v3-matrix.sbatch). It prints the verdict,
          # writes examples/<test>/ci_status_SCHE_<s>_LMEM_<l>.txt and exits 1 on FAIL.
          echo "PWD: $(pwd)"
          chmod +x ./ci/check_correctness.sh
          ./ci/check_correctness.sh "${{ matrix.name }}" "${{ matrix.scheduler }}" "${{ matrix.localmem }}"

      - name: Report Performance
        id: row_report
        if: always()
        env:
          TEST_NAME: ${{ matrix.name }}
          SCHEDULE: ${{ matrix.scheduler }}
          LMEM: ${{ matrix.localmem }}
          ROW_STATUS: ${{ job.status }}
        run: |
          staging=$(mktemp -d "$RUNNER_TEMP/ci-row.XXXXXXXX")
          echo "path=$staging" >> "$GITHUB_OUTPUT"
          report="$staging/$TEST_NAME"
          mkdir "$report"
          source_dir="$CI_RUN_SUBDIR/examples/$TEST_NAME"
          verdict="ci_status_SCHE_${SCHEDULE}_LMEM_${LMEM}.txt"
          if [[ "$ROW_STATUS" == success ]]; then
            cp "$source_dir/$verdict" "$report/"
          else
            echo FAIL > "$report/$verdict"
          fi
          shopt -s nullglob
          perf=( "$source_dir"/Perf_counter_*_SCHE_${SCHEDULE}_LOCAL_MEM_${LMEM}.txt )
          if [[ ${#perf[@]} == 0 && "$LMEM" == 1 ]]; then
            perf=( "$source_dir"/Perf_counter_*_SCHE_${SCHEDULE}.txt )
          fi
          for file in "${perf[@]}"; do
            cp "$file" "$report/"
            python3 "$CI_RUN_SUBDIR/ci/perf_summary.py" "$file" "$TEST_NAME (SCHE_$SCHEDULE, LMEM=$LMEM)" "$SCHEDULE" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-row-${{ matrix.name }}-s${{ matrix.scheduler }}-l${{ matrix.localmem }}
          path: ${{ steps.row_report.outputs.path }}
          overwrite: true
          if-no-files-found: error

  complete:
    runs-on: self-hosted
    needs: tests
    permissions:
      actions: read
      contents: read
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Check Completion
        env:
          MATRIX_RESULT: ${{ needs.tests.result }}
        run: |
          echo "Test matrix result: $MATRIX_RESULT"
          test "$MATRIX_RESULT" = success

      - uses: actions/checkout@v4
        if: always()
        with:
          path: ${{ env.CI_RUN_SUBDIR }}/report-tools
          sparse-checkout: ci
      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: ci-row-*
          path: ${{ runner.temp }}/ci-summary
          merge-multiple: true
          # List the entire run, including successful jobs from earlier attempts.
          github-token: ${{ github.token }}
      - name: Performance Summary
        if: always()
        run: python3 "$CI_RUN_SUBDIR/report-tools/ci/perf_summary_all.py" "$RUNNER_TEMP/ci-summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove run checkout
        if: always()
        run: rm -rf -- "$CI_RUN_SUBDIR"

