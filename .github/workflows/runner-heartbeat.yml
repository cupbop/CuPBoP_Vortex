name: Runner Heartbeat

on:
  schedule:
    # This runs at 00:00 on the 1st and 15th of every month
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to run it manually to test

jobs:
  heartbeat:
    runs-on: self-hosted
    steps:
      - name: Runner Check-in
        run: |
          echo "Heartbeat check-in at $(date)"
          echo "Runner is alive and kicking on $(hostname)"
